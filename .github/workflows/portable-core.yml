name: portable core
on:
  push:
    paths:
      - 'gui/core/**'
      - 'gui/tests/*_core_test.cpp'
      - 'gui/tests/*_fixture.h'
      - '.github/workflows/portable-core.yml'
  pull_request:
    paths:
      - 'gui/core/**'
      - 'gui/tests/*_core_test.cpp'
      - 'gui/tests/*_fixture.h'
      - '.github/workflows/portable-core.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure without Qt or OS drivers
        run: cmake -S gui/core -B build/portable-core -DCMAKE_BUILD_TYPE=Release
      - name: Compile with warnings as errors
        run: cmake --build build/portable-core --config Release --parallel 2
      - name: Test synthetic reads, validation, errors, lifetime and concurrency
        run: ctest --test-dir build/portable-core -C Release --output-on-failure --output-junit results.xml
      - name: Check offline snapshot parsing with memory and undefined-behavior sanitizers
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -S gui/core -B build/sanitized-core -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build/sanitized-core --target umc_capture_core_test --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build/sanitized-core -R '^umc_capture_core$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-core-${{ matrix.os }}
          path: |
            build/portable-core/results.xml
            build/portable-core/Testing/Temporary/LastTest.log
            build/sanitized-core/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
