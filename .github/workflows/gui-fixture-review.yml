name: Granite Fmax GUI review
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Portability run with successful SDK jobs and identical GUI inputs
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: el7, image: 'oraclelinux:7', sdk: el7-baseline}
          - {target: ubuntu24.04, image: 'ubuntu:24.04', sdk: el8-baseline}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify identical GUI and build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          mkdir -p build/fmax-review
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['BASELINE_RUN']
          assert run.isdecimal()
          api=lambda path:json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          baseline=api(f'actions/runs/{run}')
          assert baseline['path']=='.github/workflows/portability.yml'
          assert baseline['conclusion']=='success' or (baseline['status']=='in_progress' and baseline['conclusion'] is None)
          jobs=api(f'actions/runs/{run}/jobs?per_page=100')['jobs']
          sdk=[j for j in jobs if j['name'] in ('baseline','baseline_el7')]
          assert len(sdk)==2 and all(j['conclusion']=='success' for j in sdk)
          base=baseline['head_sha']; head=os.environ['GITHUB_SHA']
          changed=subprocess.check_output(['git','diff','--name-only',base,head]).decode().splitlines()
          allowed={'cli/test_process.py','.github/workflows/gui-fixture-review.yml'}
          assert all(p in allowed or p.startswith('docs/') or p=='README.md' for p in changed),changed
          same=subprocess.check_output(['git','diff','--name-only',base,head,'--','gui','port','cli/commands.cpp','cli/tests.cpp'])
          assert not same,same
          workflow=pathlib.Path('.github/workflows/gui-fixture-review.yml')
          evidence=dict(source_commit=head,baseline_commit=base,baseline_run=int(run),changed_paths=changed,
              runtime_and_build_inputs_identical=True,fixture_inputs_identical=True,
              workflow_sha256=hashlib.sha256(workflow.read_bytes()).hexdigest(),hardware_execution=False,
              reason='The main workflow retained the previous fixed screenshot list; this supplement exports the already-generated Granite Fmax capture without changing application or fixture inputs.')
          pathlib.Path('build/fmax-review/provenance.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sdk }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: build/inputs
      - name: Run GUI regression and retain Fmax captures
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --init -e OCTOOL_DISPOSABLE_CONTAINER=1 -e JOBS=4 \
            -v "$PWD:/src" -v "$PWD/build/inputs:/inputs:ro" -v "$PWD/build/fmax-review:/out" \
            -w /src "$IMAGE" bash port/ci/in-container.sh desktop "$TARGET"
          cp "build/gui-$TARGET/regression/granite-fmax-fixture.png" build/fmax-review/
          test -s build/fmax-review/granite-fmax-fixture.png
          test -s build/fmax-review/pbo-fmax-verified-fixture.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granite-fmax-review-${{ matrix.target }}
          path: |
            build/fmax-review/provenance.json
            build/fmax-review/gui-tests.txt
            build/fmax-review/granite-fmax-fixture.png
            build/fmax-review/pbo-fmax-verified-fixture.png
          if-no-files-found: error
          retention-days: 14
