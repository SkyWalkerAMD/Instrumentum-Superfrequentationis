name: Granite APOB comparison GUI review
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Portability run with successful SDK jobs and identical GUI inputs
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: el7, image: 'oraclelinux:7', sdk: el7-baseline}
          - {target: ubuntu24.04, image: 'ubuntu:24.04', sdk: el8-baseline}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify identical GUI and build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          mkdir -p build/topology-review
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['BASELINE_RUN']
          assert run.isdecimal()
          api=lambda path:json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          baseline=api(f'actions/runs/{run}')
          assert baseline['path']=='.github/workflows/portability.yml'
          assert baseline['conclusion']=='success' or (baseline['status']=='in_progress' and baseline['conclusion'] is None)
          jobs=api(f'actions/runs/{run}/jobs?per_page=100')['jobs']
          sdk=[j for j in jobs if j['name'] in ('baseline','baseline_el7')]
          assert len(sdk)==2 and all(j['conclusion']=='success' for j in sdk)
          base=baseline['head_sha']; head=os.environ['GITHUB_SHA']
          changed=subprocess.check_output(['git','diff','--name-only',base,head]).decode().splitlines()
          collector='port/ci/in-container.sh'
          allowed={collector,'.github/workflows/gui-fixture-review.yml',
              '.github/workflows/rea-granite-study.yml','analysis/tools/firmware-granite-semantics.py',
              'analysis/tools/firmware-granite-scheduling.py'}
          assert all(p in allowed or p.startswith('docs/') or p=='README.md' for p in changed),changed
          same=subprocess.check_output(['git','diff','--name-only',base,head,'--','gui','port','cli']).decode().splitlines()
          assert same==[collector],same
          before=subprocess.check_output(['git','show',base+':'+collector])
          after=pathlib.Path(collector).read_bytes()
          additions=[line for line in after.splitlines(keepends=True) if b'/amd-apob-comparison-fixture.png' in line]
          expected=[f'        cp "{folder}/amd-apob-comparison-fixture.png" "$out/amd-apob-comparison-fixture.png"\n'.encode()
              for folder in ('build/gui/regression','build/gui-$target/regression')]
          assert additions==expected
          assert b''.join(line for line in after.splitlines(keepends=True) if line not in additions)==before
          workflow=pathlib.Path('.github/workflows/gui-fixture-review.yml')
          evidence=dict(source_commit=head,baseline_commit=base,baseline_run=int(run),changed_paths=changed,
              runtime_and_build_inputs_identical=True,fixture_inputs_identical=True,
              collector_changes_only_png_exports=True,collector_sha256=hashlib.sha256(after).hexdigest(),
              workflow_sha256=hashlib.sha256(workflow.read_bytes()).hexdigest(),hardware_execution=False,
              reason='Only two PNG export lines are added to the collector. Application, compiler, packaging and fixture inputs are unchanged; separately tested research changes are outside those inputs. This supplement retains the APOB comparison capture generated by the same tests.')
          pathlib.Path('build/topology-review/provenance.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sdk }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: build/inputs
      - name: Run GUI regression and retain APOB comparison capture
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --init -e OCTOOL_DISPOSABLE_CONTAINER=1 -e JOBS=4 \
            -v "$PWD:/src" -v "$PWD/build/inputs:/inputs:ro" -v "$PWD/build/topology-review:/out" \
            -w /src "$IMAGE" bash port/ci/in-container.sh desktop "$TARGET"
          test -s build/topology-review/amd-apob-comparison-fixture.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-fixture-review-${{ matrix.target }}
          path: |
            build/topology-review/provenance.json
            build/topology-review/gui-tests.txt
            build/topology-review/amd-apob-comparison-fixture.png
          if-no-files-found: error
          retention-days: 14
