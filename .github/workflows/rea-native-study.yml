name: REA native reference study
on:
  push:
    paths:
      - '.github/workflows/rea-native-study.yml'
      - 'analysis/tools/rea-native-study.py'
  workflow_dispatch:
    inputs:
      study:
        description: Selected, hash-verified original functions
        type: choice
        options: [baseline, arrays, monitors, percore, pbo_layout, pbo_semantics]
        default: baseline
      startup_timeout_ms:
        description: Ghidra startup deadline in milliseconds
        type: string
        default: '900000'
      disabled_analyzers:
        description: Exact Ghidra analyzer names to disable (comma-separated)
        type: string
        default: 'GCC Exception Handlers,Decompiler Switch Analysis,Call Convention ID'
permissions:
  contents: read
jobs:
  pm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Reading the existing draft reference attachment requires a writer token.
    # Only the fetch step receives it; neither REA nor Ghidra receives tokens.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch and verify the existing reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/rea-input build/rea-evidence build/rea-tools
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/600130240" > build/rea-input/octool
          echo '44598dc8177050599afcc46f6355504161f942330d7917d1aaa010d864aaff10  build/rea-input/octool' | sha256sum -c -
          chmod 600 build/rea-input/octool
      - name: Install isolated, pinned analysis tools
        run: |
          curl --fail --location --retry 3 \
            https://registry.npmjs.org/rea-agents/-/rea-agents-6.7.0.tgz \
            -o build/rea-tools/rea-agents-6.7.0.tgz
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          p = Path('build/rea-tools/rea-agents-6.7.0.tgz')
          assert base64.b64encode(hashlib.sha512(p.read_bytes()).digest()).decode() == \
            'yhIx2ioJYYT1C/tONfYeitC6LhnKmCh+ZwRUOgYuhSc733lGhkkt73zhug9WmLgxoMdKuqIYGCoBfD4fXkOhFw=='
          PY
          npm install --prefix build/rea-tools --ignore-scripts --no-audit --no-fund \
            ./build/rea-tools/rea-agents-6.7.0.tgz
          curl --fail --location --retry 3 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip \
            -o build/rea-tools/ghidra.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  build/rea-tools/ghidra.zip' | sha256sum -c -
          unzip -q build/rea-tools/ghidra.zip -d build/rea-tools
          cp build/rea-tools/package-lock.json build/rea-evidence/
      - name: Query the static AMD PM implementation
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/build/rea-tools/ghidra_12.1.4_PUBLIC
          GHIDRA_HEADLESS_MAXMEM: 4G
          REA_GHIDRA_STARTUP_TIMEOUT_MS: ${{ inputs.startup_timeout_ms || '900000' }}
          REA_GHIDRA_DISABLED_ANALYZERS: ${{ inputs.disabled_analyzers || 'GCC Exception Handlers,Decompiler Switch Analysis,Call Convention ID' }}
          REA_STUDY: ${{ inputs.study || 'baseline' }}
        run: |
          python3 analysis/tools/rea-native-study.py \
            --binary build/rea-input/octool \
            --rea build/rea-tools/node_modules/rea-agents/scripts/rea.mjs \
            --output build/rea-evidence --study "$REA_STUDY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-amd-pm-study
          # Only selected static observations and dependency metadata.
          # Do not upload the original executable, tool caches or environments.
          path: build/rea-evidence/
          retention-days: 14
          if-no-files-found: error
