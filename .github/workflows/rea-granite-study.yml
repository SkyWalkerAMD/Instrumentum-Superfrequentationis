name: REA Granite Ridge firmware study
on:
  push:
    paths:
      - '.github/workflows/rea-granite-study.yml'
      - 'analysis/tools/firmware-granite-input.py'
      - 'analysis/tools/firmware-granite-proof.py'
      - 'analysis/tools/firmware-granite-rails.py'
      - 'analysis/tools/firmware-granite-shared-request.py'
      - 'analysis/tools/firmware-granite-semantics.py'
      - 'analysis/tools/firmware-granite-topology.py'
      - 'analysis/tools/firmware-granite-telemetry.py'
      - 'analysis/tools/firmware-granite-registers.py'
      - 'analysis/tools/firmware-granite-counters.py'
      - 'analysis/tools/firmware-granite-channels.py'
      - 'analysis/tools/firmware-granite-codes.py'
      - 'analysis/tools/firmware-granite-performance.py'
      - 'analysis/tools/firmware-granite-clock-models.py'
      - 'analysis/tools/firmware-granite-producers.py'
      - 'analysis/tools/firmware-granite-transfers.py'
      - 'analysis/tools/firmware-granite-model-inputs.py'
      - 'analysis/tools/firmware-granite-fmax.py'
      - 'analysis/tools/firmware-granite-config-route.py'
      - 'analysis/tools/firmware-granite-config-port.py'
      - 'analysis/tools/firmware-granite-consumers.py'
      - 'analysis/tools/firmware-granite-apic.py'
      - 'analysis/tools/firmware-granite-apic-enumeration.py'
      - 'analysis/tools/firmware-granite-published-topology.py'
      - 'analysis/tools/firmware-granite-apob-comparison.py'
      - 'gui/tests/amd_apob_reference_vectors.h'
      - 'gui/tests/amd_9950x3d_topology_fixture.h'
      - 'analysis/tools/firmware-granite-topology-protocol.py'
      - 'analysis/tools/firmware-granite-register-targets.py'
      - 'analysis/tools/firmware-granite-provider-gates.py'
      - 'analysis/tools/firmware-granite-apob-handoff.py'
      - 'analysis/tools/ghidra/Granite*.java'
      - 'analysis/tools/ghidra/SmuFpPatch.py'
      - 'analysis/tools/ghidra/SmuFpSelfTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned analysis tools
        run: |
          mkdir -p build/firmware-tools build/firmware-evidence build/firmware-input
          curl --fail --location --retry 3 https://registry.npmjs.org/rea-agents/-/rea-agents-6.7.0.tgz -o build/firmware-tools/rea.tgz
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          assert base64.b64encode(hashlib.sha512(Path('build/firmware-tools/rea.tgz').read_bytes()).digest()).decode() == 'yhIx2ioJYYT1C/tONfYeitC6LhnKmCh+ZwRUOgYuhSc733lGhkkt73zhug9WmLgxoMdKuqIYGCoBfD4fXkOhFw=='
          PY
          npm install --prefix build/firmware-tools --ignore-scripts --no-audit --no-fund ./build/firmware-tools/rea.tgz
          cp build/firmware-tools/package-lock.json build/firmware-evidence/
          curl --fail --location --retry 3 https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip -o build/firmware-tools/ghidra.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  build/firmware-tools/ghidra.zip' | sha256sum -c -
          unzip -q build/firmware-tools/ghidra.zip -d build/firmware-tools
          curl --fail --location --retry 3 https://github.com/LongSoft/UEFITool/releases/download/A76/UEFIExtract_NE_A76_x64_linux.zip -o build/firmware-tools/uefi.zip
          echo '1bee0a3556d47288a0cfbfb8f08ca791a35826686cf8fb998b5f2cefdc860619  build/firmware-tools/uefi.zip' | sha256sum -c -
          unzip -q build/firmware-tools/uefi.zip -d build/firmware-tools/uefi
          chmod +x build/firmware-tools/uefi/uefiextract
      - name: Extend and compile the isolated static Xtensa decoder
        run: |
          python3 analysis/tools/ghidra/SmuFpPatch.py --ghidra build/firmware-tools/ghidra_12.1.4_PUBLIC \
            --granite-postincrement \
            --output build/firmware-evidence/xtensa-fp-extension.json
          build/firmware-tools/ghidra_12.1.4_PUBLIC/support/sleigh \
            build/firmware-tools/ghidra_12.1.4_PUBLIC/Ghidra/Processors/Xtensa/data/languages/xtensa_le.slaspec
      - name: Install isolated APIC replay dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --no-deps --target build/firmware-tools/python unicorn==2.1.4 pefile==2024.8.26
      - name: Extract pinned Granite Ridge reference inputs
        id: inputs
        run: |
          curl --fail --location --retry 3 https://dlcdnets.asus.com/pub/ASUS/mb/BIOS/ProArt-X870E-CREATOR-WIFI-ASUS-2503.ZIP -o build/firmware-input/asus-2503.zip
          python3 analysis/tools/firmware-granite-input.py --archive build/firmware-input/asus-2503.zip --output build/firmware-input --uefi-extract build/firmware-tools/uefi/uefiextract
          cp build/firmware-input/granite-input-manifest.json build/firmware-evidence/
      - name: Static SMU and MP5 discovery without Shimada address assumptions
        run: |
          mkdir -p build/firmware-project build/firmware-home
          for component in smu mp5; do
            mkdir -p build/firmware-evidence/$component
            env -i PATH="$PATH" JAVA_HOME="$JAVA_HOME" HOME="$PWD/build/firmware-home" LANG=C.UTF-8 \
              build/firmware-tools/ghidra_12.1.4_PUBLIC/support/analyzeHeadless \
              "$PWD/build/firmware-project" granite-$component \
              -import "$PWD/build/firmware-input/$component-62-54-body.bin" -loader BinaryLoader \
              -processor Xtensa:LE:32:default -cspec default \
              -scriptPath "$PWD/analysis/tools/ghidra" \
              -preScript SmuFpSelfTest.java "$PWD/build/firmware-evidence/xtensa-fp-selftest-$component.json" granite-postincrement \
              -preScript GraniteSeed.java \
              -postScript GraniteStudy.java "$PWD/build/firmware-evidence/$component" $component \
              -analysisTimeoutPerFile 1200 -max-cpu 2 \
              -log "$PWD/build/firmware-evidence/ghidra-$component.log" \
              -scriptlog "$PWD/build/firmware-evidence/script-$component.log"
            test -s build/firmware-evidence/$component/smu-study.json
          done
      - name: Replay byte-checked Granite Ridge layout and metadata instructions
        run: |
          python3 - <<'PY'
          import json
          for component in ('smu','mp5'):
              r=json.load(open(f'build/firmware-evidence/xtensa-fp-selftest-{component}.json'))
              assert r['passed'] and r['synthetic_cases']==12240
          PY
          python3 analysis/tools/firmware-granite-proof.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --mp5-study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-proof.json
          python3 analysis/tools/firmware-granite-rails.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --study build/firmware-evidence/smu/smu-study.json \
            --output build/firmware-evidence/granite-rails-proof.json
          python3 analysis/tools/firmware-granite-shared-request.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --study build/firmware-evidence/smu/smu-study.json \
            --output build/firmware-evidence/granite-shared-request.json
          python3 analysis/tools/firmware-granite-semantics.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-semantics.json
          python3 analysis/tools/firmware-granite-topology.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --mp5-study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-topology.json
          python3 analysis/tools/firmware-granite-telemetry.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --study build/firmware-evidence/smu/smu-study.json \
            --output build/firmware-evidence/granite-telemetry.json
          python3 analysis/tools/firmware-granite-registers.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --study build/firmware-evidence/smu/smu-study.json \
            --output build/firmware-evidence/granite-registers.json
          python3 analysis/tools/firmware-granite-counters.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-counters.json
          python3 analysis/tools/firmware-granite-channels.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --study build/firmware-evidence/smu/smu-study.json \
            --output build/firmware-evidence/granite-channels.json
          python3 analysis/tools/firmware-granite-codes.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-codes.json
          python3 analysis/tools/firmware-granite-performance.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --mp5-study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-performance.json
          python3 analysis/tools/firmware-granite-clock-models.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --mp5-study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-clock-models.json
          python3 analysis/tools/firmware-granite-producers.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-producers.json
          python3 analysis/tools/firmware-granite-transfers.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-transfers.json
          python3 analysis/tools/firmware-granite-model-inputs.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-model-inputs.json
          python3 analysis/tools/firmware-granite-fmax.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --output build/firmware-evidence/granite-fmax.json
          python3 analysis/tools/firmware-granite-config-route.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --mp5-study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-config-route.json
          python3 analysis/tools/firmware-granite-config-port.py \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-config-port.json
          python3 analysis/tools/firmware-granite-consumers.py \
            --smu build/firmware-input/smu-62-54-body.bin \
            --mp5 build/firmware-input/mp5-62-54-body.bin \
            --smu-study build/firmware-evidence/smu/smu-study.json \
            --mp5-study build/firmware-evidence/mp5/smu-study.json \
            --output build/firmware-evidence/granite-consumers.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-apic.py \
            --binary build/firmware-input/uefi-granite-topology.bin \
            --output build/firmware-evidence/granite-apic.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-topology-protocol.py \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --topology build/firmware-input/uefi-granite-topology.bin \
            --output build/firmware-evidence/granite-topology-protocol.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-register-targets.py \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --output build/firmware-evidence/granite-register-targets.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-provider-gates.py \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --output build/firmware-evidence/granite-provider-gates.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-apob-handoff.py \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --output build/firmware-evidence/granite-apob-handoff.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-apic-enumeration.py \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --topology build/firmware-input/uefi-granite-topology.bin \
            --output build/firmware-evidence/granite-apic-enumeration.json
          curl --fail --location --retry 3 https://raw.githubusercontent.com/InstLatx64/InstLatx64/895c35aba50508c64cd38d8892fe98b0954142d7/AuthenticAMD/AuthenticAMD0B40F40_K20_GraniteRidge_06_CPUID.txt -o build/firmware-input/9950x3d-cpuid.txt
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-published-topology.py \
            --capture build/firmware-input/9950x3d-cpuid.txt \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --topology build/firmware-input/uefi-granite-topology.bin \
            --output build/firmware-evidence/granite-published-topology.json
          PYTHONPATH="$PWD/build/firmware-tools/python" python3 analysis/tools/firmware-granite-apob-comparison.py \
            --capture build/firmware-input/9950x3d-cpuid.txt \
            --provider-a build/firmware-input/uefi-granite-topology-provider-a.bin \
            --provider-b build/firmware-input/uefi-granite-topology-provider-b.bin \
            --topology build/firmware-input/uefi-granite-topology.bin \
            --output build/firmware-evidence/granite-apob-comparison.json
      - name: REA static UEFI entry points and RSMU transport helpers
        if: (success() || failure()) && steps.inputs.outcome == 'success'
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/build/firmware-tools/ghidra_12.1.4_PUBLIC
          GHIDRA_HEADLESS_MAXMEM: 4G
          REA_GHIDRA_STARTUP_TIMEOUT_MS: '900000'
          REA_GHIDRA_DISABLED_ANALYZERS: ''
        run: |
          python3 analysis/tools/rea-native-study.py --binary build/firmware-input/uefi-granite-transport.bin --rea build/firmware-tools/node_modules/rea-agents/scripts/rea.mjs --output build/firmware-evidence/rea-transport --study granite_transport
          python3 analysis/tools/rea-native-study.py --binary build/firmware-input/uefi-granite-transport2.bin --rea build/firmware-tools/node_modules/rea-agents/scripts/rea.mjs --output build/firmware-evidence/rea-transport2 --study granite_transport2
          python3 analysis/tools/rea-native-study.py --binary build/firmware-input/uefi-granite-topology.bin --rea build/firmware-tools/node_modules/rea-agents/scripts/rea.mjs --output build/firmware-evidence/rea-topology --study granite_topology
          python3 analysis/tools/rea-native-study.py --binary build/firmware-input/uefi-granite-topology-provider-a.bin --rea build/firmware-tools/node_modules/rea-agents/scripts/rea.mjs --output build/firmware-evidence/rea-topology-provider-a --study granite_topology_provider_a
          python3 analysis/tools/rea-native-study.py --binary build/firmware-input/uefi-granite-topology-provider-b.bin --rea build/firmware-tools/node_modules/rea-agents/scripts/rea.mjs --output build/firmware-evidence/rea-topology-provider-b --study granite_topology_provider_b
          python3 analysis/tools/rea-native-study.py --binary build/firmware-input/uefi-granite-fabric-topology.bin --rea build/firmware-tools/node_modules/rea-agents/scripts/rea.mjs --output build/firmware-evidence/rea-fabric-topology --study granite_fabric_topology
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-granite-study
          path: build/firmware-evidence/
          retention-days: 14
          if-no-files-found: error
