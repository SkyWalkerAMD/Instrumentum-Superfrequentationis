name: legacy mailbox investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-caller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated emulator dependencies
        run: |
          mkdir -p build/emulator build/mailbox-evidence
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/emulator:/deps" python:3.12-slim \
            python -m pip install --only-binary=:all: --target /deps -r /src/analysis/tools/requirements-emulation.txt
          docker image inspect python:3.12-slim > build/mailbox-evidence/image.json
      - name: Emulate only the original MMIO wrappers with synthetic responses
        run: |
          sudo chown -R 10001:10001 build/mailbox-evidence
          docker run --rm --user 10001:10001 --network none --cap-drop ALL --read-only \
            --security-opt no-new-privileges:true --pids-limit 64 --memory 512m \
            -e PYTHONPATH=/deps -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -v "$PWD/build/emulator:/deps:ro" \
            -v "$PWD/build/mailbox-evidence:/out" python:3.12-slim \
            python /src/analysis/tools/emulate-legacy-mailbox.py /src/analysis/fixtures/legacy-mmio-wrappers.json --fixture \
            --output /out/emulation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-mailbox-evidence
          path: build/mailbox-evidence/
          if-no-files-found: error
          retention-days: 14
