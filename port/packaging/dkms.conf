PACKAGE_NAME="octool-hwio"
PACKAGE_VERSION="2.0.1"
BUILT_MODULE_NAME[0]="octool_hwio"
BUILT_MODULE_LOCATION[0]="kmod"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Re-evaluate on every DKMS kernel-upgrade build, not only package installation.
octool_cc="${OCTOOL_KERNEL_CC:-gcc}"
if [ -r "${kernel_source_dir:-}/include/generated/autoconf.h" ]; then
    octool_gcc_major=$(awk '$2 == "CONFIG_GCC_VERSION" {print int($3/10000)}' "${kernel_source_dir}/include/generated/autoconf.h")
    if [ -n "$octool_gcc_major" ] && command -v "gcc-$octool_gcc_major" >/dev/null 2>&1; then
        octool_cc="gcc-$octool_gcc_major"
    fi
fi
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/kmod CC=${octool_cc} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/kmod clean"
AUTOINSTALL="yes"
